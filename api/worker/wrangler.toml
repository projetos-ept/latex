# =============================================================================
# Portal TCC ABNT — configuração do Cloudflare Worker
# -----------------------------------------------------------------------------
# Recursos provisionados em 19/09/2026. Segredos (ADMIN_SENHA, TOKEN_SEGREDO)
# ficam fora deste arquivo — ver ../../PENDENCIAS.md.
# =============================================================================

name = "portal-tcc-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# ---------------------------------------------------------------- variáveis --
[vars]
# Trocar por "https://projetos-ept.github.io" assim que o GitHub Pages estiver no ar.
ORIGENS_PERMITIDAS = "*"
# Domínio público do bucket R2, se você configurar um. Vazio = servir via Worker.
R2_PUBLIC_URL = ""

# ------------------------------------------------------------------ banco D1 --
# Criado em 19/09/2026 na conta lucas-batista-biomedico.
[[d1_databases]]
binding = "DB"
database_name = "portal-tcc"
database_id = "aec7a4a3-b1ec-47fc-9a18-18c17cccd8b0"

# ------------------------------------------------------------- armazenamento --
# wrangler r2 bucket create portal-tcc-arquivos
[[r2_buckets]]
binding = "ARQUIVOS"
bucket_name = "portal-tcc-arquivos"

# --------------------------------------------------------------- observação ---
# Segredos NÃO ficam neste arquivo. Defina com:
#   wrangler secret put ADMIN_SENHA
#   wrangler secret put TOKEN_SEGREDO
