<title>Portal TCC ABNT</title>
<meta name="description" content="Portal para escrever TCC, dissertação e tese em blocos editáveis, com biblioteca de referências ABNT, geração de LaTeX e exportação para o Overleaf.">
<meta name="theme-color" content="#12203a">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">

      </span>
